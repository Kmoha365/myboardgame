name: Boardgame-CI

on:
  push:
    branches: ["main"]

jobs:
  Security_Scan:
   runs-on: ubuntu-latest
   steps:
     - name: checkout
       uses: actions/checkout@v4
     - name: Gitleaks scan
       uses: gitleaks/gitleaks-action@v2
       
  Compile:
    runs-on: ubuntu-latest
    needs: Security_Scan
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: maven

      - name: Compile
        run: mvn compile


  Test:
    runs-on: ubuntu-latest
    needs: Compile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: maven

      - name: Run Tests
        run: mvn test


  Build:
    runs-on: ubuntu-latest
    needs: Test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: maven

      - name: Package Application
        run: mvn package

 
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: boardgame-build
          path: target/*.jar
  Docker_Image_Build:
    runs-on: ubuntu-latest
    needs: Build
    
    steps:
      - name: dockerhub login
        run: |
          echo "${{secrets.DOCKER_USERNAME}}" |
          docker login -u "${{secrets.DOCKER_USERNAME}}" --password-stdin
      - name: Docker image build
        run: |
          docker build -t ${{secrets.DOCKER_USERNAME}}/boardgame:${{github.sha}} .

      - name: Docker image push
        run: |
          docker push ${{secrets.DOCKER_USERNAME}}/boardgame:${{github.sha}}
