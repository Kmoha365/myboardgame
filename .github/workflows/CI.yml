name: Boardgame-CI
on:
  push:
    branches: ["main"]
jobs:
  Compile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: setup java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: maven
      - name: compile
        run: mvn compile
  Test:
    runs-on: ubuntu-latest
    needs: Compile
    steps:
     - name: checkout
       uses: actions/checkout@v4
     - name: Test_case
       run: mvn test
  Build:
    runs-on: ubuntu-latest
    needs: Test
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: build_pacakge
        run: mvn package
  UploadArtifcats:
     runs-on: ubuntu-latest
     needs: Build
     steps:
       - name: upload artifact
         uses: actions/upload-artifact@v4
         with:
           name: boardgame-build
           path: target/*.jar
  
