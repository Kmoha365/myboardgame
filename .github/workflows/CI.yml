name: Boardgame-CI

on:
  push:
    branches: ["main"]

jobs:

  Compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: maven

      - name: Compile
        run: mvn compile


  Test:
    runs-on: ubuntu-latest
    needs: Compile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: maven

      - name: Run Tests
        run: mvn test


  Build:
    runs-on: ubuntu-latest
    needs: Test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: maven

      - name: Package Application
        run: mvn package

      # ✅ Upload Artifact HERE
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: boardgame-build
          path: target/*.jar
