name: Boardgame-CI

on:
  push:
    branches: ["main"]
env:
  IMAGE_NAME: boardgame

jobs:
  Security_Scan:
   runs-on: ubuntu-latest
   steps:
     - name: checkout
       uses: actions/checkout@v4
     - name: Gitleaks scan
       uses: gitleaks/gitleaks-action@v2
       
  Build_Test:
    runs-on: ubuntu-latest
    needs: Security_Scan
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: maven

      - name: Build
        run: mvn -B clean verify

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: boardgame-JAR
          path: target/*.jar

      - name: Upload Jacoco Report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reprot
          path: target/site/jacoco
        
  Dependency_Scan:
    runs-on: ubuntu-latest
    needs: Build_Test
    steps:
      - name: OWASP dependency scan
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: "boardgame"
          path: "."
          format: "HTML"
          
  Docker_Image_Build:
    runs-on: ubuntu-latest
    needs: Dependency_Scan
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: boardgame-JAR
          path: target/

      - name: dockerhub login
        run: echo "${{secrets.DOCKER_PASSWORD}}" |
          docker login -u "${{secrets.DOCKER_USERNAME}}" --password-stdin
      - name: Docker image build
        run: |
          docker build -t ${{secrets.DOCKER_USERNAME}}/boardgame:${{github.sha}} .

      - name: Docker image push
        run: |
          docker push ${{secrets.DOCKER_USERNAME}}/boardgame:${{github.sha}}
